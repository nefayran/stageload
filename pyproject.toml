[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "stageload"
dynamic = ["version"]
description = "Run multi-stage PyTorch pipelines on Apple Silicon with one stage's weights in memory at a time."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Rodion Kazennov" }]
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=7", "ruff>=0.6", "numpy>=1.24", "pillow>=10"]
bench = ["numpy>=1.24", "trimesh>=4", "matplotlib>=3.7", "pillow>=10"]

[project.scripts]
stageload = "stageload.cli:main"
stageload-pixal3d = "stageload.pixal3d.cli:main"

[project.urls]
Homepage = "https://github.com/nefayran/stageload"

[tool.hatch.version]
path = "src/stageload/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stageload"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fake_port"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
